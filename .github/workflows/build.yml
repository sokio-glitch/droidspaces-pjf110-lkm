name: Build PJF110 LKM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned android14-6.1 DDK (same image upstream used for the 6.1 baseline).
      image: ghcr.io/ylarod/ddk-min@sha256:1dd6ac340b627a90a4031d6d0df6b129d8cc949b139fb56032c898f023d3d5d3
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "KDIR=${KDIR:-<unset>}"
          command -v clang make python3 pahole gunzip || true
          clang --version | head -1 || true

      - name: Build, validate, package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-pjf110.sh

      - name: Build optional extension modules (devtmpfs, experimental)
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          EXT_TARGETS="devtmpfs" bash scripts/build-ext.sh

      - name: Upload extension build output
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pjf110-ext
          path: |
            out/ext/*.ko
            out/ext/*.log
            out/ext/*.imports

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Droidspaces-PJF110-LKM
          path: |
            out/pjf110/Droidspaces-PJF110-LKM.zip
            out/pjf110/droidspaces_ns-pjf110.ko
            out/pjf110/layout-report.json
            out/pjf110/imports.txt

      - name: Collect release files
        if: success()
        run: |
          mkdir -p rel
          cp -v out/pjf110/Droidspaces-PJF110-LKM.zip rel/
          cp -v out/pjf110/droidspaces_ns-pjf110.ko rel/
          if [ -f out/ext/droidspaces_devtmpfs-pjf110.ko ]; then
            cp -v out/ext/droidspaces_devtmpfs-pjf110.ko rel/
          else
            echo "devtmpfs extension not built; releasing core only"
          fi
          ls -l rel/

      - name: Publish release asset
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PJF110 LKM build ${{ github.run_number }}
          files: rel/*
          body: |
            Experimental Droidspaces namespace LKM for OnePlus Ace 3V (PJF110),
            kernel 6.1.141-android14-11-o-g16e6ef702577. Install the ZIP in the
            KernelSU manager and reboot. See README for safety notes.

            The core module is `Droidspaces-PJF110-LKM.zip`.
            `droidspaces_devtmpfs-pjf110.ko` is an OPTIONAL, not-yet-live-tested
            devtmpfs extension (hardware-access mode); do not install it unless
            you need real /dev nodes.